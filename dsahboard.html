    <style>
        :root {
            --sidebar-width: 250px;
        }
        body {
            font-family: 'Inter', sans-serif;
        }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        .page { display: none; }
        .page.active { display: block; }
        .sidebar-link.active {
            background-color: #3b82f6; /* bg-blue-600 */
            color: white;
        }
        .sidebar-link.active svg {
            color: white;
        }
        .animate-enter {
            animation: enter 0.2s ease-out;
        }
        .animate-leave {
            animation: leave 0.2s ease-in forwards;
        }
        @keyframes enter {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes leave {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.95); }
        }
        .status-chip {
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
        }
        .status-Pending { background-color: #f59e0b; color: white; }
        .status-Processing { background-color: #3b82f6; color: white; }
        .status-Packing { background-color: #8b5cf6; color: white; }
        .status-Ready { background-color: #10b981; color: white; }
        .status-InTransit { background-color: #6366f1; color: white; }
        .status-Delivered { background-color: #14532d; color: white; }
        .status-Cancelled { background-color: #ef4444; color: white; }
        .status-Returned { background-color: #f97316; color: white; }

        .pathao-status-chip {
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .pathao-Pickup-Requested { background-color: #eab308; color: #422006; }
        .pathao-In-Transit { background-color: #3b82f6; color: white; }
        .pathao-Delivered { background-color: #22c55e; color: white; }
        
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .loader {
            width: 16px;
            height: 16px;
            border: 2px solid #FFF;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

            success: 'bg-green-500',
            error: 'bg-red-500',
            info: 'bg-blue-500',

        const toast = document.createElement('div');
        toast.className = `animate-enter text-white px-4 py-2 rounded-md shadow-lg ${colors[type]}`;

        }, 3000);

    function copyToClipboard(text, successCallback) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.top = "0";
        textArea.style.left = "0";
        textArea.style.position = "fixed";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
            const successful = document.execCommand('copy');
            if (successful) successCallback();
            else showToast('Failed to copy link.', 'error');
        } catch (err) {
             showToast('Failed to copy link.', 'error');
        }
        document.body.removeChild(textArea);

        // Add filtering logic here later

        const batchListBody = document.getElementById('batch-list-body');
        if (!batchListBody) return;
        batchListBody.innerHTML = '';
        state.batches.forEach(batch => {
            const batchOrders = state.orders.filter(o => batch.order_ids.includes(o.id));
            const allItems = batchOrders.flatMap(o => o.items);
            const buying = allItems.reduce((sum, i) => sum + (i.base_price_bdt_snapshot * i.qty), 0);
            const selling = allItems.reduce((sum, i) => sum + (i.sell_price_bdt_snapshot * i.qty), 0);
            const profit = selling - buying;

            const row = `
                 <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold text-gray-800">#${batch.id}</td>

                    <td class="px-6 py-4 text-sm text-gray-700">${batch.note}</td>

                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                        <div class="text-green-600 font-semibold">Profit: ${formatBDT(profit)}</div>
                        <div class="text-xs text-gray-500">Sell: ${formatBDT(selling)}</div>
                    </td>

                </tr>
            `;
            batchListBody.insertAdjacentHTML('beforeend', row);
        });
    }
    
    function renderCustomerList() {
        const customerListBody = document.getElementById('customer-list-body');
        if (!customerListBody) return;

        const searchTerm = document.getElementById('customer-search').value.toLowerCase();
        customerListBody.innerHTML = '';

        state.customers
            .filter(c => c.name.toLowerCase().includes(searchTerm) || c.phone.includes(searchTerm))
            .forEach(customer => {
                const customerOrders = state.orders.filter(o => o.customer_id === customer.id);
                const totalOrders = customerOrders.length;
                const totalSpend = customerOrders.reduce((sum, order) => {
                    const itemsTotal = order.items.reduce((itemSum, item) => itemSum + (item.sell_price_bdt_snapshot * item.qty), 0);
                    return sum + itemsTotal + order.delivery_charge_bdt;
                }, 0);

                const row = `
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm font-medium text-gray-900">${customer.name}</div>
                            <div class="text-sm text-gray-500">${customer.address_default || 'No address on file'}</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${customer.phone}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm text-gray-900">${totalOrders} Orders</div>
                            <div class="text-sm text-green-600 font-semibold">${formatBDT(totalSpend)} Total Spend</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button class="bg-blue-100 text-blue-700 px-3 py-1 rounded-md text-sm hover:bg-blue-200 new-order-for-customer-btn" data-id="${customer.id}">New Order</button>
                        </td>
                    </tr>
                `;
                customerListBody.insertAdjacentHTML('beforeend', row);
            });
    }

                            <input type="file" accept="image/*" class="variant-image mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-1.5 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">

                e.preventDefault();
                document.getElementById(cardId).remove();

        document.getElementById('product-list-body').addEventListener('click', e => {
            if (e.target.classList.contains('edit-product-btn')) {
                const productId = parseInt(e.target.dataset.id);
                const product = state.products.find(p => p.id === productId);
                if (product) {
                    // Populate and show the form for editing
                    document.getElementById('product-id-input').value = product.id;
                    document.querySelector('#product-form [name="name"]').value = product.name;
                    document.querySelector('#product-form [name="description"]').value = product.description || '';
                    // ... populate other fields ...
                    showForm();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }
        });

        document.getElementById('product-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const form = document.getElementById('product-form');
            const productId = parseInt(document.getElementById('product-id-input').value);
            
            const mainImageInput = form.elements['main_image_url'];
            const mainImageUrl = mainImageInput.files.length > 0 ? URL.createObjectURL(mainImageInput.files[0]) : 'https://placehold.co/400x400?text=No+Image';
            
            const variants = [];
            const groupCards = document.querySelectorAll('#variant-groups-container .variant-group-card');
            
            groupCards.forEach(card => {
                const color = card.querySelector('.variant-color').value;
                const imageInput = card.querySelector('.variant-image');
                const sizesStr = card.querySelector('.variant-sizes').value;
                const priceOverride = card.querySelector('.variant-price-override').value;

                if (!color || !sizesStr) return; // Skip incomplete groups

                const imageUrl = imageInput.files.length > 0 ? URL.createObjectURL(imageInput.files[0]) : null;
                const sizes = sizesStr.split(',').map(s => s.trim()).filter(s => s); // Split, trim, and remove empty entries

                sizes.forEach(size => {
                    variants.push({
                        id: Date.now() + Math.random(),
                        color: color,
                        size: size,
                        variant_image_url: imageUrl,
                        sell_price_bdt: priceOverride ? parseFloat(priceOverride) : null,
                    });
                });
            });

            const productName = form.elements['name'].value;
            const firstLetter = productName ? productName.charAt(0).toUpperCase() : 'P';
            const randomDigits = String(Math.floor(Math.random() * 90000) + 10000);
            const generatedCode = `${firstLetter}-${randomDigits}`;

            const newProductData = {
                name: productName,
                code: generatedCode,
                source_link: form.elements['source_link'].value,
                base_price_bdt: parseFloat(form.elements['base_price_bdt'].value),
                sell_price_bdt: parseFloat(form.elements['sell_price_bdt'].value),
                main_image_url: mainImageUrl,
                description: form.elements['description'].value,
                active: form.elements['active'].checked,
                variants: variants
            };

            if (productId) {
                // Update existing product
                const index = state.products.findIndex(p => p.id === productId);
                if (index !== -1) {
                    // Preserve original code on update
                    newProductData.code = state.products[index].code;
                    state.products[index] = { ...state.products[index], ...newProductData };
                    showToast('Product updated successfully!', 'success');
                }
            } else {
                // Create new product
                newProductData.id = Date.now();
                state.products.push(newProductData);
                showToast('Product created successfully!', 'success');
            }
            
            formContainer.classList.add('hidden');
            renderProductList();
        });
    }
    
    // --- CREATE ORDER PAGE LOGIC ---
    let createOrderItems = [];

    // Self-contained, global function to update the order summary
    function updateCreateOrderSummary() {
        const deliveryChargeRadio = document.querySelector('#create-order-page input[name="delivery_option"]:checked');
        const deliveryCharge = deliveryChargeRadio ? state.settings.delivery_charge_map[deliveryChargeRadio.value] : 0;
        
        const advanceInput = document.getElementById('co-advance-bdt');
        const advance = advanceInput ? parseFloat(advanceInput.value) || 0 : 0;

        const subtotal = createOrderItems.reduce((sum, item) => sum + (item.unit_sell_price_bdt * item.qty), 0);
        const due = subtotal + deliveryCharge - advance;
        
        const subtotalEl = document.getElementById('co-subtotal');
        if (subtotalEl) subtotalEl.textContent = formatBDT(subtotal);

        const deliveryEl = document.getElementById('co-delivery-summary');
        if (deliveryEl) deliveryEl.textContent = formatBDT(deliveryCharge);
        
        const dueEl = document.getElementById('co-due-total');
        if (dueEl) dueEl.textContent = formatBDT(due);
    }

    function initCreateOrderPage() {
        lucide.createIcons();
        const orderIdToEdit = state.editingOrderId;
        const prefilledCustomer = state.prefilledCustomer;
        state.editingOrderId = null; // Clear it immediately after use
        state.prefilledCustomer = null; // Clear it immediately

        const pageTitle = document.querySelector('#create-order-page h2');
        const saveBtn = document.getElementById('save-order-btn');

        if (orderIdToEdit) {
            pageTitle.textContent = `Edit Order #${orderIdToEdit}`;
            saveBtn.textContent = 'Update Order';
            
            const order = state.orders.find(o => o.id === orderIdToEdit);
            const customer = state.customers.find(c => c.id === order.customer_id);
            
            document.getElementById('co-customer-name').value = customer.name;
            document.getElementById('co-customer-phone').value = customer.phone;
            document.getElementById('co-customer-address').value = order.address;
            
            createOrderItems = order.items.map(item => {
                const product = state.products.find(p => p.id === item.product_id);
                return {
                    uniqueId: Date.now() + Math.random(),
                    product_id: item.product_id,
                    product: product,
                    variant_id: item.variant_id,
                    qty: item.qty,
                    unit_sell_price_bdt: item.sell_price_bdt_snapshot
                };
            });
            
            document.getElementById('co-advance-bdt').value = order.advance_bdt;
            document.getElementById('co-eta').value = order.eta_start;

            let chargeKey = 'outside';
            if (order.delivery_charge_bdt === state.settings.delivery_charge_map.dhaka) chargeKey = 'dhaka';
            if (order.delivery_charge_bdt === state.settings.delivery_charge_map.sub_dhaka) chargeKey = 'sub_dhaka';
            const radioToCheck = document.querySelector(`input[name="delivery_option"][value="${chargeKey}"]`);
            if(radioToCheck) radioToCheck.checked = true;

        } else if (prefilledCustomer) {
            pageTitle.textContent = 'Create New Order';
            saveBtn.textContent = 'Save Order';
            document.getElementById('co-customer-name').value = prefilledCustomer.name;
            document.getElementById('co-customer-phone').value = prefilledCustomer.phone;
            document.getElementById('co-customer-address').value = prefilledCustomer.address_default || '';
            createOrderItems = [];
        }
        else {
            pageTitle.textContent = 'Create New Order';
            saveBtn.textContent = 'Save Order';
            createOrderItems = []; // Reset for new order
        }
        
        renderCreateOrderItems();
        updateCreateOrderSummary();
        
        // Populate Pathao dropdowns
        const citySelect = document.getElementById('co-pathao-city');
        const zoneSelect = document.getElementById('co-pathao-zone');
        const areaSelect = document.getElementById('co-pathao-area');
        
        citySelect.innerHTML = '<option>Select District</option>' + state.pathaoCache.cities.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

        citySelect.addEventListener('change', () => {
            const cityId = citySelect.value;
            zoneSelect.disabled = !cityId;
            zoneSelect.innerHTML = '<option>Select Zone</option>';
            areaSelect.innerHTML = '<option>Select Area</option>';
            areaSelect.disabled = true;
            if (cityId && state.pathaoCache.zones[cityId]) {
                 zoneSelect.innerHTML += state.pathaoCache.zones[cityId].map(z => `<option value="${z.id}">${z.name}</option>`).join('');
            }
            const selectedCityName = citySelect.options[citySelect.selectedIndex].text;
            const deliveryOptionToSelect = (selectedCityName === 'Dhaka') ? 'dhaka' : 'outside';
            const radioToSelect = document.querySelector(`input[name="delivery_option"][value="${deliveryOptionToSelect}"]`);
            if (radioToSelect) {
                radioToSelect.checked = true;
                updateCreateOrderSummary();
            }
        });

        zoneSelect.addEventListener('change', () => {
             const zoneId = zoneSelect.value;
            areaSelect.disabled = !zoneId;
            areaSelect.innerHTML = '<option>Select Area</option>';
            if (zoneId && state.pathaoCache.areas[zoneId]) {
                 areaSelect.innerHTML += state.pathaoCache.areas[zoneId].map(a => `<option value="${a.id}">${a.name}</option>`).join('');
            }
        });

        const itemSearchInput = document.getElementById('co-item-search');
        const searchResults = document.getElementById('co-item-search-results');

        searchResults.addEventListener('click', (e) => {
            if (e.target.classList.contains('search-result-item')) {
                const productId = parseInt(e.target.dataset.id);
                addOrderItem(productId);
                itemSearchInput.value = '';
                searchResults.classList.add('hidden');
            }
        });

        itemSearchInput.addEventListener('input', () => {
            const query = itemSearchInput.value.toLowerCase();
            if (query.length < 2) {
                searchResults.classList.add('hidden');
                return;
            }
            const results = state.products.filter(p => p.active && (p.name.toLowerCase().includes(query) || p.id.toString().includes(query)));
            searchResults.innerHTML = results.map(p => `<div class="p-2 hover:bg-gray-100 cursor-pointer search-result-item" data-id="${p.id}">${p.name}</div>`).join('');
            searchResults.classList.remove('hidden');
        });
        
        document.addEventListener('click', (e) => {
            if (!itemSearchInput.contains(e.target)) {
                 searchResults.classList.add('hidden');
            }
        });

        document.getElementById('delivery-charge-options').addEventListener('change', updateCreateOrderSummary);
        document.getElementById('co-advance-bdt').addEventListener('input', updateCreateOrderSummary);

        document.getElementById('co-items-list').addEventListener('input', (e) => {
             if(e.target.classList.contains('co-item-qty') || e.target.classList.contains('co-item-price')) {
                const itemDiv = e.target.closest('.co-order-item');
                const uniqueId = itemDiv.dataset.uniqueId;
                const item = createOrderItems.find(i => i.uniqueId == uniqueId);
                if (item) {
                    item.qty = parseInt(itemDiv.querySelector('.co-item-qty').value);
                    item.unit_sell_price_bdt = parseFloat(itemDiv.querySelector('.co-item-price').value);
                    updateCreateOrderSummary();
                }
            }
        });
         document.getElementById('co-items-list').addEventListener('change', (e) => {
             if(e.target.classList.contains('co-variant-select')) {
                const itemDiv = e.target.closest('.co-order-item');
                const uniqueId = itemDiv.dataset.uniqueId;
                const item = createOrderItems.find(i => i.uniqueId == uniqueId);
                if (item) {
                    const variantId = parseInt(e.target.value);
                    item.variant_id = variantId;
                    const variant = state.products.find(p => p.id === item.product_id).variants.find(v => v.id === variantId);
                    if (variant) {
                        item.unit_sell_price_bdt = variant.sell_price_bdt || item.product.sell_price_bdt;
                        itemDiv.querySelector('.co-item-price').value = item.unit_sell_price_bdt;
                        itemDiv.querySelector('img').src = variant.variant_image_url || item.product.main_image_url;
                        updateCreateOrderSummary();
                    }
                }
            }
        });

        document.getElementById('co-items-list').addEventListener('click', e => {
            const removeButton = e.target.closest('.remove-co-item');
            if (removeButton) {
                const uniqueId = removeButton.dataset.uniqueId;
                createOrderItems = createOrderItems.filter(i => i.uniqueId != uniqueId);
                renderCreateOrderItems();
                updateCreateOrderSummary();
            }
        });

        document.getElementById('save-order-btn').addEventListener('click', () => {
            if (createOrderItems.length === 0) {
                showToast('Please add at least one item to the order.', 'error');
                return;
            }
            
            const deliveryChargeRadio = document.querySelector('#create-order-page input[name="delivery_option"]:checked');
            const deliveryCharge = deliveryChargeRadio ? state.settings.delivery_charge_map[deliveryChargeRadio.value] : 0;
            
            const orderData = {
                address: document.getElementById('co-customer-address').value,
                delivery_charge_bdt: deliveryCharge,
                advance_bdt: parseFloat(document.getElementById('co-advance-bdt').value) || 0,
                pathao_city_name: document.getElementById('co-pathao-city').options[document.getElementById('co-pathao-city').selectedIndex].text,
                pathao_zone_name: document.getElementById('co-pathao-zone').options[document.getElementById('co-pathao-zone').selectedIndex].text,
                pathao_area_name: document.getElementById('co-pathao-area').options[document.getElementById('co-pathao-area').selectedIndex].text,
                eta_start: document.getElementById('co-eta').value,
                eta_end: document.getElementById('co-eta').value,
                items: createOrderItems.map((item, index) => {
                    const product = item.product;
                    let snapshotData = {};

                    if (item.variant_id) {
                        const variant = product.variants.find(v => v.id === item.variant_id);
                        snapshotData = {
                            variant_id: item.variant_id,
                            color_snapshot: variant.color,
                            size_snapshot: variant.size,
                            image_url_snapshot: variant.variant_image_url || product.main_image_url,
                        };
                    } else {
                        snapshotData = {
                            variant_id: null,
                            color_snapshot: 'N/A',
                            size_snapshot: 'N/A',
                            image_url_snapshot: product.main_image_url,
                        };
                    }
                    
                    return {
                        id: 400 + state.orders.flatMap(o => o.items).length + index + 1,
                        product_id: item.product_id,
                        qty: item.qty,
                        product_name_snapshot: product.name,
                        product_link_snapshot: product.source_link,
                        sell_price_bdt_snapshot: item.unit_sell_price_bdt,
                        base_price_bdt_snapshot: product.base_price_bdt,
                        ...snapshotData
                    };
                }),
            };
            const subtotal = orderData.items.reduce((sum, i) => sum + (i.sell_price_bdt_snapshot * i.qty), 0);
            orderData.due_bdt = subtotal + orderData.delivery_charge_bdt - orderData.advance_bdt;

             // Handle customer creation/lookup
            const customerName = document.getElementById('co-customer-name').value;
            const customerPhone = document.getElementById('co-customer-phone').value;
            let customer = state.customers.find(c => c.phone === customerPhone);
            if (!customer) {
                customer = { id: 300 + state.customers.length + 1, name: customerName, phone: customerPhone, address_default: orderData.address };
                state.customers.push(customer);
            }
            orderData.customer_id = customer.id;

            if (orderIdToEdit) {
                // UPDATE LOGIC
                const orderIndex = state.orders.findIndex(o => o.id === orderIdToEdit);
                if(orderIndex !== -1) {
                    const originalOrder = state.orders[orderIndex];
                    state.orders[orderIndex] = { ...originalOrder, ...orderData, order_id: orderIdToEdit };
                     showToast(`Order #${orderIdToEdit} updated successfully!`, 'success');
                     window.location.hash = '#orders';
                }
            } else {
                // CREATE LOGIC
                const newOrderId = 2024000 + state.orders.length + 1;
                const newOrder = {
                    ...orderData,
                    id: newOrderId,
                    created_at: new Date().toISOString(),
                    status: 'Pending',
                    pathao_tracking_code: null, pathao_order_id: null, pathao_status: null, last_synced_at: null,
                };
                newOrder.items.forEach(item => item.order_id = newOrderId);
                state.orders.unshift(newOrder);
                showCreateOrderSuccessModal(newOrderId);
            }

            createOrderItems = [];
        });
    }

    function addOrderItem(productId) {
        const product = state.products.find(p => p.id === productId);
        if (!product) return;

        let newItem;

        if (product.variants && product.variants.length > 0) {
            // Product HAS variants, use the first one as default
            const firstVariant = product.variants[0];
            newItem = {
                uniqueId: Date.now(),
                product_id: product.id,
                product: product,
                variant_id: firstVariant.id,
                qty: 1,
                unit_sell_price_bdt: firstVariant.sell_price_bdt || product.sell_price_bdt
            };
        } else {
            // Product has NO variants
            newItem = {
                uniqueId: Date.now(),
                product_id: product.id,
                product: product,
                variant_id: null, // IMPORTANT
                qty: 1,
                unit_sell_price_bdt: product.sell_price_bdt
            };
        }
        
        createOrderItems.push(newItem);
        renderCreateOrderItems();
        updateCreateOrderSummary();
    }

    function renderCreateOrderItems() {
        const itemsList = document.getElementById('co-items-list');
        if (!itemsList) return;
        itemsList.innerHTML = '';
        createOrderItems.forEach(item => {
             const product = item.product;
             let itemHTML = '';

             if (item.variant_id) {
                // Product has variants
                const selectedVariant = product.variants.find(v => v.id === item.variant_id);
                if (!selectedVariant) {
                    console.error("Could not find variant for item:", item);
                    return;
                }
                const variantOptions = product.variants.map(v => `<option value="${v.id}" ${v.id === item.variant_id ? 'selected' : ''}>${v.color} - ${v.size}</option>`).join('');

                itemHTML = `
                    <div class="flex items-center gap-4 border p-2 rounded-md co-order-item" data-unique-id="${item.uniqueId}">
                        <img src="${selectedVariant.variant_image_url || product.main_image_url}" class="w-16 h-16 object-cover rounded-md">
                        <div class="flex-grow">
                            <p class="font-semibold">${product.name}</p>
                            <select class="co-variant-select mt-1 text-sm border-gray-300 rounded-md shadow-sm">${variantOptions}</select>
                        </div>
                        <div class="w-24">
                            <label class="text-xs">Price</label>
                            <input type="number" value="${item.unit_sell_price_bdt}" class="co-item-price w-full p-1 border rounded-md">
                        </div>
                        <div class="w-16">
                            <label class="text-xs">Qty</label>
                            <input type="number" value="${item.qty}" min="1" class="co-item-qty w-full p-1 border rounded-md">
                        </div>
                        <button class="remove-co-item text-red-500 hover:text-red-700 p-1" data-unique-id="${item.uniqueId}">
                            <i data-lucide="x-circle" class="w-5 h-5 pointer-events-none"></i>
                        </button>
                    </div>
                `;
            } else {
                // Product has NO variants
                itemHTML = `
                    <div class="flex items-center gap-4 border p-2 rounded-md co-order-item" data-unique-id="${item.uniqueId}">
                        <img src="${product.main_image_url}" class="w-16 h-16 object-cover rounded-md">
                        <div class="flex-grow">
                            <p class="font-semibold">${product.name}</p>
                            <p class="text-sm text-gray-500 mt-1">Standard Product</p>
                        </div>
                        <div class="w-24">
                            <label class="text-xs">Price</label>
                            <input type="number" value="${item.unit_sell_price_bdt}" class="co-item-price w-full p-1 border rounded-md">
                        </div>
                        <div class="w-16">
                            <label class="text-xs">Qty</label>
                            <input type="number" value="${item.qty}" min="1" class="co-item-qty w-full p-1 border rounded-md">
                        </div>
                        <button class="remove-co-item text-red-500 hover:text-red-700 p-1" data-unique-id="${item.uniqueId}">
                            <i data-lucide="x-circle" class="w-5 h-5 pointer-events-none"></i>
                        </button>
                    </div>
                `;
            }
            itemsList.insertAdjacentHTML('beforeend', itemHTML);
        });

    function initOrdersPage() {
        lucide.createIcons();

            const bulkActionSelect = document.getElementById('bulk-action-select');
            if (bulkActionSelect) {
                const batchOption = bulkActionSelect.querySelector('option[value="batch"]');

            }

        renderOrderList();
        
        document.getElementById('order-list-body').addEventListener('click', e => {
            const viewButton = e.target.closest('.view-order-btn');
            if (viewButton) {
                const orderId = parseInt(viewButton.dataset.id);
                showOrderDrawer(orderId);
            }
        });
        
        const selectAllCheckbox = document.getElementById('select-all-orders');
        const bulkActionsBar = document.getElementById('bulk-actions-bar');
        const bulkSelectionCount = document.getElementById('bulk-selection-count');
        
        const updateBulkActionsBar = () => {
            const selectedCount = document.querySelectorAll('.order-checkbox:checked').length;
            if (selectedCount > 0) {
                bulkActionsBar.classList.remove('hidden');
                bulkSelectionCount.textContent = `${selectedCount} selected`;
            } else {
                bulkActionsBar.classList.add('hidden');
            }
        };

        selectAllCheckbox.addEventListener('change', (e) => {
            document.querySelectorAll('.order-checkbox').forEach(checkbox => checkbox.checked = e.target.checked);
            updateBulkActionsBar();
        });

        document.getElementById('order-list-body').addEventListener('change', e => {
            if(e.target.classList.contains('order-checkbox')) {
                 if (!e.target.checked) {
                    selectAllCheckbox.checked = false;
                }
                updateBulkActionsBar();
            }
        });
        
        document.getElementById('bulk-action-select').addEventListener('change', e => {
            document.getElementById('bulk-status-select').classList.toggle('hidden', e.target.value !== 'status');
        });
        
        document.getElementById('bulk-action-apply').addEventListener('click', () => {
            const selectedAction = document.getElementById('bulk-action-select').value;
            const selectedOrderIds = Array.from(document.querySelectorAll('.order-checkbox:checked')).map(cb => parseInt(cb.dataset.id));
            
            if (selectedOrderIds.length === 0) {
                showToast('No orders selected.', 'error');
                return;
            }

            if (state.currentUser.role === 'moderator' && selectedAction === 'batch') {
                showToast('Access Denied. Moderators cannot add orders to batches.', 'error');
                return;
            }

            switch (selectedAction) {
                case 'status':
                    const newStatus = document.getElementById('bulk-status-select').value;
                    state.orders.forEach(order => {
                        if (selectedOrderIds.includes(order.id)) {
                            order.status = newStatus;
                        }
                    });
                    showToast(`${selectedOrderIds.length} orders updated to "${newStatus}".`, 'success');
                    break;
                case 'batch':
                    showAssignToBatchModal(selectedOrderIds);
                    break;
                case 'pathao_send':
                case 'pathao_sync':
                case 'export':
                    showToast(`Action "${selectedAction}" is not yet implemented.`, 'info');
                    break;
                default:
                    showToast('Please select a valid bulk action.', 'error');
                    return;
            }
            
            renderOrderList();
            document.getElementById('select-all-orders').checked = false;
            updateBulkActionsBar();
        });
    }

    function initBatchDetailsPage(batchId) {
        lucide.createIcons();
        const batch = state.batches.find(b => b.id == batchId);

        if (!batch) {
            document.getElementById('content-area').innerHTML = `<div class="text-center text-red-500">Batch not found. <a href="#batches" class="underline">Go back</a>.</div>`;
            return;
        }

        const batchOrders = state.orders.filter(o => batch.order_ids.includes(o.id));
        const allItems = batchOrders.flatMap(o => o.items);
        
        const buying = allItems.reduce((sum, i) => sum + (i.base_price_bdt_snapshot * i.qty), 0);
        const selling = allItems.reduce((sum, i) => sum + (i.sell_price_bdt_snapshot * i.qty), 0);
        const profit = selling - buying;

        // Populate header and analytics
        document.getElementById('batch-id-details').textContent = batch.id;
        document.getElementById('batch-created-date').textContent = formatDate(batch.created_at);
        document.getElementById('batch-note-details').textContent = batch.note;
        document.getElementById('batch-buying-price').textContent = formatBDT(buying);
        document.getElementById('batch-selling-price').textContent = formatBDT(selling);
        document.getElementById('batch-profit').textContent = formatBDT(profit);
        document.getElementById('batch-order-count').textContent = batchOrders.length;

        // Populate orders list
        const ordersListBody = document.getElementById('batch-orders-list-body');
        ordersListBody.innerHTML = '';
        batchOrders.forEach(order => {
            const customer = state.customers.find(c => c.id === order.customer_id);
            const itemSummary = order.items.map(i => `${i.qty}x ${i.product_name_snapshot.substring(0, 15)}...`).join(', ');
            const row = `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold text-blue-600">#${order.id}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${customer.name}</td>
                    <td class="px-6 py-4 text-sm text-gray-500">${itemSummary}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold text-red-600">${formatBDT(order.due_bdt)}</td>
                    <td class="px-6 py-4 whitespace-nowrap"><span class="status-chip status-${order.status}">${order.status}</span></td>
                </tr>
            `;
            ordersListBody.insertAdjacentHTML('beforeend', row);
        });

        // Add event listener for the main export button
        document.getElementById('export-agent-file').addEventListener('click', () => {
            showToast('Generating Agent XLSX file...', 'info');
            
            // --- 1. Prepare data for Agent_Order_Summary sheet ---
            const productSummary = allItems.reduce((acc, item) => {
                if (!acc[item.product_id]) {
                    const product = state.products.find(p => p.id === item.product_id);
                    acc[item.product_id] = {
                        product: product,
                        totalQty: 0,
                        variants: {} // e.g., { "Red 41": 2, "Red 42": 1 }
                    };
                }
                
                acc[item.product_id].totalQty += item.qty;
                const variantKey = `${item.color_snapshot} ${item.size_snapshot}`;
                acc[item.product_id].variants[variantKey] = (acc[item.product_id].variants[variantKey] || 0) + item.qty;

                return acc;
            }, {});

            const summarySheetData = Object.values(productSummary).map(summary => {
                const variantsSummaryString = Object.entries(summary.variants)
                    .map(([variant, qty]) => `${variant}×${qty}`)
                    .join('; ');
                
                return {
                    'BatchID': batch.id,
                    'ProductID': summary.product.id,
                    'ProductName': summary.product.name,
                    'ProductLink': summary.product.source_link || '',
                    'ImageURL': summary.product.main_image_url || '',
                    'VariantsSummary': variantsSummaryString,
                    'TotalQty': summary.totalQty,
                    'PricePerUnit_CNY (Agent)': '',
                    'Seller→Agent_Ship_CNY (Agent)': '',
                    'Subtotal_CNY': '',
                    'TotalCost_CNY': '',
                    'TotalCost_BDT': '',
                    'Notes': ''
                };
            });

            // --- 2. Prepare data for Variant_Details sheet ---
            const variantDetails = allItems.reduce((acc, item) => {
                const key = `${item.product_id}-${item.color_snapshot}-${item.size_snapshot}`;
                if (!acc[key]) {
                    acc[key] = {
                        'BatchID': batch.id,
                        'ProductID': item.product_id,
                        'ProductName': item.product_name_snapshot,
                        'Color': item.color_snapshot,
                        'Size': item.size_snapshot,
                        'Qty': 0,
                        'ImageURL': item.image_url_snapshot || ''
                    };
                }
                acc[key].Qty += item.qty;
                return acc;
            }, {});

            const variantSheetData = Object.values(variantDetails);

            // --- 3. Prepare data for ReadMe sheet ---
            const readMeSheetData = [
                ['How to use:'],
                ['1) Agent_Order_Summary = one row per product (all variants grouped).'],
                ['   - Agent fills: PricePerUnit_CNY and Seller→Agent_Ship_CNY.'],
                ['   - Subtotal/Total in CNY and BDT are auto-calculated (formulas need to be set up in Excel).'],
                ['2) Variant_Details = per-variant breakdown used for packing/verification.'],
                [],
                ['CNY_to_BDT_Rate', 15.0] // Default Rate
            ];

            // --- 4. Use SheetJS to create and download the multi-sheet XLSX file ---
            const wb = XLSX.utils.book_new();
            const wsSummary = XLSX.utils.json_to_sheet(summarySheetData);
            const wsVariants = XLSX.utils.json_to_sheet(variantSheetData);
            const wsReadMe = XLSX.utils.aoa_to_sheet(readMeSheetData);
            
            XLSX.utils.book_append_sheet(wb, wsSummary, "Agent_Order_Summary");
            XLSX.utils.book_append_sheet(wb, wsVariants, "Variant_Details");
            XLSX.utils.book_append_sheet(wb, wsReadMe, "ReadMe");
            
            XLSX.writeFile(wb, `Batch_${batch.id}_Agent_Order_List.xlsx`);
        });
    }

        const statuses = ['Pending', 'Processing', 'Packing', 'InTransit', 'Delivered'];

        const timelineHTML = statuses.map((status, index) => {

            return `

                </div>
                ${index < statuses.length - 1 ? '<div class="h-12 w-0.5 bg-gray-300 ml-4"></div>' : ''}

        backdrop.addEventListener('click', closeModal);
        document.getElementById('close-batch-modal-btn').addEventListener('click', closeModal);

        document.getElementById('save-batch-btn').addEventListener('click', () => {
            const note = document.getElementById('batch-note').value;
             if (!note) {
                showToast('Please enter a name or note for the batch.', 'error');
                return;
            }

            const newBatch = {
                id: 500 + state.batches.length + 1,
                note: note,
                created_at: new Date().toISOString(),
                created_by: 'admin',
                order_ids: []
            };

            state.batches.push(newBatch);
            showToast(`Batch #${newBatch.id} created successfully.`, 'success');
            closeModal();
            renderBatchList();
        });
        
        document.getElementById('generate-batch-note-btn').addEventListener('click', async e => {
            const prompt = `Generate a short, practical batch name.`;
            const note = await callGeminiAPI(prompt, e.target);
            document.getElementById('batch-note').value = note;
        });
    }
    
    function showAssignToBatchModal(selectedOrderIds) {
        const allBatchedOrderIds = state.batches.flatMap(b => b.order_ids);
        const unbatchedSelectedIds = selectedOrderIds.filter(id => !allBatchedOrderIds.includes(id));

        const modalHTML = `
            <div id="assign-batch-modal-backdrop" class="fixed inset-0 bg-black bg-opacity-50 z-40"></div>
            <div id="assign-batch-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4">
                <div class="bg-white rounded-lg shadow-xl w-full max-w-md transform scale-95 opacity-0 transition-all duration-200">
                    <div class="p-6">
                        <div class="flex justify-between items-center border-b pb-3 mb-4">
                            <h2 class="text-xl font-bold text-gray-800">Assign to Batch</h2>
                             <button id="close-assign-modal-btn" class="p-1 rounded-full hover:bg-gray-200">
                                <i data-lucide="x" class="w-5 h-5 text-gray-600"></i>
                            </button>
                        </div>
                        <p class="text-sm text-gray-600 mb-4">You have selected ${selectedOrderIds.length} orders. ${unbatchedSelectedIds.length} are unbatched and can be assigned.</p>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Select Batch</label>
                            <select id="assign-batch-select" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                                ${state.batches.map(b => `<option value="${b.id}">#${b.id} - ${b.note}</option>`).join('')}
                            </select>
                        </div>
                        <div class="mt-6 flex justify-end">
                            <button id="assign-orders-btn" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">Assign ${unbatchedSelectedIds.length} Orders</button>
                        </div>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('modal-container').innerHTML = modalHTML;
        lucide.createIcons();

        const modal = document.querySelector('#assign-batch-modal > div');
        const backdrop = document.getElementById('assign-batch-modal-backdrop');

        const closeModal = () => {
            modal.classList.add('scale-95', 'opacity-0');
            backdrop.classList.add('opacity-0');
            setTimeout(() => document.getElementById('modal-container').innerHTML = '', 200);
        };

        setTimeout(() => modal.classList.remove('scale-95', 'opacity-0'), 10);
        backdrop.addEventListener('click', closeModal);
        document.getElementById('close-assign-modal-btn').addEventListener('click', closeModal);

        document.getElementById('assign-orders-btn').addEventListener('click', () => {
            const targetBatchId = parseInt(document.getElementById('assign-batch-select').value);
            const targetBatch = state.batches.find(b => b.id === targetBatchId);

            if (!targetBatch) {
                showToast('Selected batch not found.', 'error');
                return;
            }

            if (unbatchedSelectedIds.length > 0) {
                targetBatch.order_ids = [...new Set([...targetBatch.order_ids, ...unbatchedSelectedIds])];
                showToast(`${unbatchedSelectedIds.length} orders assigned to Batch #${targetBatchId}.`, 'success');
            } else {
                showToast('No new orders to assign.', 'info');
            }

            const skippedCount = selectedOrderIds.length - unbatchedSelectedIds.length;
            if (skippedCount > 0) {
                showToast(`${skippedCount} selected orders were already in a batch and were skipped.`, 'info');
            }
            
            closeModal();
            document.querySelectorAll('.order-checkbox:checked').forEach(cb => cb.checked = false);
            document.getElementById('select-all-orders').checked = false;
            document.getElementById('bulk-actions-bar').classList.add('hidden');
        });
    }
    
    function showCreateOrderSuccessModal(orderId) {
        const trackingLink = `${window.location.origin}${window.location.pathname}#track/${orderId}`;
        const modalHTML = `
             <div id="success-modal-backdrop" class="fixed inset-0 bg-black bg-opacity-50 z-40"></div>
            <div id="success-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4">
                <div class="bg-white rounded-lg shadow-xl w-full max-w-md transform scale-95 opacity-0 transition-all duration-200 text-center p-6">
                    <i data-lucide="check-circle-2" class="w-16 h-16 text-green-500 mx-auto mb-4"></i>
                    <h2 class="text-2xl font-bold text-gray-800">Order Created!</h2>
                    <p class="text-gray-500 mt-2">Order #${orderId} has been successfully created.</p>
                    <div class="bg-gray-100 p-3 rounded-lg my-4">
                         <label class="block text-sm font-medium text-gray-700 mb-1">Shareable Customer Tracking Link:</label>
                         <div class="flex items-center gap-2">
                            <input type="text" readonly id="success-tracking-link" value="${trackingLink}" class="w-full text-sm bg-gray-200 p-2 rounded-md border-transparent focus:ring-0">
                            <button id="copy-success-link-btn" class="bg-blue-100 text-blue-700 p-2 rounded-md hover:bg-blue-200"><i data-lucide="copy" class="w-5 h-5"></i></button>
                         </div>
                    </div>
                    <button id="close-success-modal-btn" class="w-full bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">Done</button>
                </div>
            </div>
        `;

        document.getElementById('modal-container').innerHTML = modalHTML;
        lucide.createIcons();

        const modal = document.querySelector('#success-modal > div');
        const backdrop = document.getElementById('success-modal-backdrop');
        const closeBtn = document.getElementById('close-success-modal-btn');
        const copyBtn = document.getElementById('copy-success-link-btn');

        const closeModal = () => {
            modal.classList.add('scale-95', 'opacity-0');
            backdrop.classList.add('opacity-0');
            setTimeout(() => {
                document.getElementById('modal-container').innerHTML = '';
                window.location.hash = '#orders'; // Navigate after closing
            }, 200);
        };
        
        setTimeout(() => modal.classList.remove('scale-95', 'opacity-0'), 10);
        backdrop.addEventListener('click', closeModal);
        closeBtn.addEventListener('click', closeModal);
        copyBtn.addEventListener('click', (e) => {
             copyToClipboard(trackingLink, () => {
                showToast('Tracking link copied to clipboard!');
                const icon = e.currentTarget.querySelector('i');
                icon.setAttribute('data-lucide', 'check');
                lucide.createIcons();
            });
        });
    }


    // --- ROUTER & SIDEBAR ---
    const contentArea = document.getElementById('content-area');
    const appContainer = document.getElementById('app-container');

    function renderSidebar() {
        const navLinks = [
            { href: '#orders', icon: 'shopping-cart', text: 'Orders', roles: ['admin', 'moderator'] },
            { href: '#create-order', icon: 'plus-circle', text: 'Create Order', roles: ['admin', 'moderator'] },
            { href: '#catalog', icon: 'book-open', text: 'Catalog', roles: ['admin'] },
            { href: '#batches', icon: 'package-check', text: 'Batches', roles: ['admin'] },
            { href: '#customers', icon: 'users', text: 'Customers', roles: ['admin'] },
        ];

        const footerLinks = [
            { href: '#settings', icon: 'settings', text: 'Settings', roles: ['admin'] },
        ];

        const userRole = state.currentUser.role;
        const sidebarNav = document.getElementById('sidebar-nav');
        const sidebarFooter = document.getElementById('sidebar-footer');

        sidebarNav.innerHTML = navLinks
            .filter(link => link.roles.includes(userRole))
            .map(link => `
                <a href="${link.href}" class="sidebar-link flex items-center p-3 rounded-md hover:bg-gray-700 transition-colors">
                    <i data-lucide="${link.icon}" class="w-5 h-5 mr-3"></i> ${link.text}
                </a>
            `).join('');

        sidebarFooter.innerHTML = footerLinks
            .filter(link => link.roles.includes(userRole))
            .map(link => `
                <a href="${link.href}" class="sidebar-link flex items-center p-3 rounded-md hover:bg-gray-700 transition-colors">
                    <i data-lucide="${link.icon}" class="w-5 h-5 mr-3"></i> ${link.text}
                </a>
            `).join('');
        
        sidebarFooter.innerHTML += `
            <a href="#" id="logout-btn" class="flex items-center p-3 rounded-md hover:bg-gray-700 transition-colors">
                <i data-lucide="log-out" class="w-5 h-5 mr-3"></i> Logout
            </a>
        `;
        
        document.getElementById('logout-btn').addEventListener('click', (e) => {
            e.preventDefault();
            state.currentUser.role = null;
            window.location.hash = ''; // Clear hash to force re-evaluation
            location.reload(); // Simple way to reset state
        });

        lucide.createIcons();
    }

    function navigate(hash) {
        const path = hash.substring(1);
        const [page, id] = path.split('/');

        // Role-based Access Control
        const moderatorRestrictedPages = ['catalog', 'batches', 'customers', 'settings'];
        if (state.currentUser.role === 'moderator' && moderatorRestrictedPages.includes(page)) {
            showToast('Access Denied. You do not have permission to view this page.', 'error');
            window.location.hash = '#orders';
            return;
        }

        // Route for batch details: #batches/501
        if (page === 'batches' && id) {
            contentArea.innerHTML = pages.batchDetails;
            initBatchDetailsPage(id);
        } 
        // Route for all other pages
        else if (pages[page]) {
            contentArea.innerHTML = pages[page];
            
            if (page === 'catalog') initCatalogPage();
            if (page === 'create-order') initCreateOrderPage();
            if (page === 'orders') initOrdersPage();
            if (page === 'batches') initBatchesPage();
            else if (page === 'customers') initCustomersPage();
            if (page === 'settings') initSettingsPage();
        }

        // Update active sidebar link
        document.querySelectorAll('.sidebar-link').forEach(link => {
            link.classList.toggle('active', link.getAttribute('href') === `#${page}`);
        });
    }

    // --- APP INITIALIZATION ---
    function init() {
        lucide.createIcons();
        document.getElementById('app-name').textContent = state.settings.appName;
        
        const loginForm = document.getElementById('login-form');
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const selectedRole = document.getElementById('role').value;
            state.currentUser.role = selectedRole;

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            
            renderSidebar();
            
            const initialHash = window.location.hash || '#orders';
            navigate(initialHash);
        });
        
        // Main router logic that decides to show tracking page or login/app
        const handleRouting = () => {
            const hash = window.location.hash;
            const path = hash.substring(1);
            const [page, id] = path.split('/');
            
            if(page === 'track' && id) {
                appContainer.innerHTML = pages.track;
                initTrackingPage(id);
            } else if (state.currentUser.role) {
                // Already logged in, just navigate
                navigate(hash || '#orders');
            } else {
                // Not a tracking page and not logged in, show login
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('main-app').classList.add('hidden');
            }
        };

        window.addEventListener('hashchange', handleRouting);
        
        // Initial load
        handleRouting();
    }

    init();
</script>

</body>
</html>
